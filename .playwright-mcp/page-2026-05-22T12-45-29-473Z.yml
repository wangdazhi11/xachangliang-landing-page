    - heading "About us" [level=2] [ref=e132]
    - heading "公司简介" [level=3] [ref=e133]
    - generic [ref=e134]:
      - paragraph [ref=e135]: 西安长亮商贸有限公司成立于2016年。简单来说，我们主要做三大块业务：废旧物资回收、工程拆除和各类物资买卖。
      - paragraph [ref=e136]: 我们在西安干这行很多年了，经验丰富。只要您有废旧电线电缆、铜铝不锈钢、稀缺金属，或者工厂淘汰下来的机电设备，我们都长期高价上门回收。此外，我们自己就有专业的施工队，不管您是需要拆厂房钢结构、还是拆卸大型机器，我们都能帮您拆卸+回收一次搞定，省心省力。
      - paragraph [ref=e137]: 做生意，我们最讲究实在：免费上门估价，看好货直接当面结清，并且绝不泄露客户的任何信息。不管您是厂房要清空大批设备，还是库房里有少量积压，找我们准没错。长亮商贸干活利索，价格公道，期待跟您交个朋友，长期合作！
